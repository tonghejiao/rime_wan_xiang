tool_bar:
  button_font:
    - iconfont.ttf
  button_spacing: 9
  buttons:
    - {
        action: Hide,
        background: { bg_highlight: 0x00, corner_radius: 10, type: rectangle },
        foreground:
          {
            fg_highlight: 0x00,
            fg_normal: text_color,
            font_size: 17,
            style: "ic@keyboard_close",
          },
      }
    - {
        action: Mode_switch,
        background: { bg_highlight: 0x00, corner_radius: 10, type: rectangle },
        foreground:
          {
            fg_highlight: 0x00,
            fg_normal: text_color,
            font_size: 18,
            option_styles: ["中", "En"],
            padding: 3,
          },
        size: [40, 40],
      }
    - {
        action: liquid_keyboard_clipboard,
        background: { bg_highlight: 0x00, corner_radius: 10, type: rectangle },
        foreground:
          {
            fg_highlight: 0x00,
            fg_normal: text_color,
            font_size: 18,
            padding: 6,
            style: "ic@clipboard"
          },
        size: [45, 28],
      }
    - {
        action: liquid_keyboard_emoji,
        background: { bg_highlight: 0x00, corner_radius: 10, type: rectangle },
        foreground:
          {
            fg_highlight: 0x00,
            fg_normal: text_color,
            font_size: 17,
            style: "ic@emoticon",
          },
      }
    - {
        action: redo,
        background: { bg_highlight: 0x00, corner_radius: 10, type: rectangle },
        foreground:
          {
            fg_highlight: 0x00,
            fg_normal: text_color,
            font_size: 17,
            style: "ic@redo",
          },
      }
    - {
        action: undo,
